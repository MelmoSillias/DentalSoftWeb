security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto

    providers:
        login_identifier_provider:
            entity:
                class: App\IdentityAccess\Domain\Entity\User
        users_in_database:
            entity:
                class: App\IdentityAccess\Domain\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # ✅ Health endpoints must stay auth-free for orchestrators (Dokploy)
        health:
            pattern: ^/(api/health|health)
            security: false

        sms_webhooks:
            pattern: ^/api/sms/webhooks/
            security: false

        auth_sessions:
            pattern: ^/api/(auth/(refresh|logout)|token/refresh|patient-portal/auth/(refresh|logout))$
            security: false

        canonical_patient_login:
            pattern: ^/api/patient-portal/auth/login$
            stateless: true
            provider: login_identifier_provider
            user_checker: App\IdentityAccess\Infrastructure\Security\LoginUserChecker
            login_throttling:
                limiter: app.login_rate_limiter
            json_login:
                check_path: /api/patient-portal/auth/login
                username_path: email
                password_path: password
                success_handler: App\IdentityAccess\Infrastructure\Security\LoginSuccessHandler
                failure_handler: App\IdentityAccess\Infrastructure\Security\LoginFailureHandler

        canonical_app_login:
            pattern: ^/api/auth/login$
            stateless: true
            provider: login_identifier_provider
            user_checker: App\IdentityAccess\Infrastructure\Security\LoginUserChecker
            login_throttling:
                limiter: app.login_rate_limiter
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: App\IdentityAccess\Infrastructure\Security\LoginSuccessHandler
                failure_handler: App\IdentityAccess\Infrastructure\Security\LoginFailureHandler

        api_patient_login:
            pattern: ^/api/login_patient_check$
            stateless: true
            provider: users_in_database
            user_checker: App\IdentityAccess\Infrastructure\Security\LoginUserChecker
            login_throttling:
                limiter: app.login_rate_limiter
            json_login:
                check_path: /api/login_patient_check
                username_path: username
                password_path: password
                success_handler: App\IdentityAccess\Infrastructure\Security\LoginSuccessHandler
                failure_handler: App\IdentityAccess\Infrastructure\Security\LoginFailureHandler

        # 🔐 JWT LOGIN (API)
        api_login:
            pattern: ^/api/login_check$
            stateless: true
            provider: users_in_database
            user_checker: App\IdentityAccess\Infrastructure\Security\LoginUserChecker
            login_throttling:
                limiter: app.login_rate_limiter
            json_login:
                check_path: /api/login_check
                username_path: username
                password_path: password
                success_handler: App\IdentityAccess\Infrastructure\Security\LoginSuccessHandler
                failure_handler: App\IdentityAccess\Infrastructure\Security\LoginFailureHandler

        # 🔐 JWT PROTECTED API
        api:
            pattern: ^/api
            stateless: true
            provider: users_in_database
            user_checker: App\IdentityAccess\Infrastructure\Security\UserEnabledChecker
            jwt: ~

    access_control:
        - { path: ^/api/auth/session$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/me/appointments(?:/|$), roles: [ROLE_ADMIN, ROLE_MEDECIN, ROLE_RECEPTION, ROLE_RECEPTIONNISTE] }
        - { path: ^/api/(auth/login|patient-portal/auth/login)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/public/(reviews|review-submissions)(/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/patient-portal/me(?:/|$), roles: ROLE_PATIENT }
        - { path: ^/api/review-moderation(?:/|$), roles: [ROLE_ADMIN, ROLE_RECEPTION, ROLE_RECEPTIONNISTE] }
        # API
        - { path: ^/api/login(?:_patient)?_check$, roles: PUBLIC_ACCESS }
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/validate$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/appreciations/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/appreciations/anonymous, roles: PUBLIC_ACCESS }
        - { path: ^/api/settings/general/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/sms/webhooks/, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [OPTIONS] }
        - { path: ^/api/portal-patient/me(?:/|$), roles: ROLE_PATIENT }
        - { path: ^/api/(vitrine|administration/appreciations)(?:/|$), roles: [ROLE_ADMIN, ROLE_RECEPTION, ROLE_RECEPTIONNISTE] }
        - { path: ^/api/me, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/me/notifications, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api, roles: [ROLE_ADMIN, ROLE_MEDECIN, ROLE_RECEPTION, ROLE_RECEPTIONNISTE] }
