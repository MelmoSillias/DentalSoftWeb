doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: false
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Billing:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Billing/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Billing\Infrastructure\Persistence\Doctrine\Entity'
                alias: Billing
            CareDelivery:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/CareDelivery/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\CareDelivery\Infrastructure\Persistence\Doctrine\Entity'
                alias: CareDelivery
            ClinicalRecord:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/ClinicalRecord/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\ClinicalRecord\Infrastructure\Persistence\Doctrine\Entity'
                alias: ClinicalRecord
            Communication:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Communication/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Communication\Infrastructure\Persistence\Doctrine\Entity'
                alias: Communication
            IdentityAccess:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/IdentityAccess/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\IdentityAccess\Infrastructure\Persistence\Doctrine\Entity'
                alias: IdentityAccess
            Inventory:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Inventory/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Inventory\Infrastructure\Persistence\Doctrine\Entity'
                alias: Inventory
            Patient:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Patient/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Patient\Infrastructure\Persistence\Doctrine\Entity'
                alias: Patient
            Scheduling:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Scheduling/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Scheduling\Infrastructure\Persistence\Doctrine\Entity'
                alias: Scheduling
            Settings:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Settings/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Settings\Infrastructure\Persistence\Doctrine\Entity'
                alias: Settings
            # When a module relocates ORM entities to Infrastructure/Persistence/Doctrine/Entity,
            # add a mapping here and remove the legacy Entity mapping for that module (never both).
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
