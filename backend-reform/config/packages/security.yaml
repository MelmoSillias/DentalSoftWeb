security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto

    providers:
        users_in_database:
            entity:
                class: App\IdentityAccess\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # ✅ Health endpoints must stay auth-free for orchestrators (Dokploy)
        health:
            pattern: ^/(api/health|health)
            security: false

        sms_webhooks:
            pattern: ^/api/sms/webhooks/
            security: false

        api_patient_login:
            pattern: ^/api/login_patient_check$
            stateless: true
            provider: users_in_database
            user_checker: App\IdentityAccess\Security\LoginUserChecker
            login_throttling:
                max_attempts: 5
                interval: '5 minutes'
            json_login:
                check_path: /api/login_patient_check
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: App\IdentityAccess\Security\LoginFailureHandler

        # 🔐 JWT LOGIN (API)
        api_login:
            pattern: ^/api/login_check$
            stateless: true
            provider: users_in_database
            user_checker: App\IdentityAccess\Security\LoginUserChecker
            login_throttling:
                max_attempts: 5
                interval: '5 minutes'
            json_login:
                check_path: /api/login_check
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: App\IdentityAccess\Security\LoginFailureHandler

        # 🔐 JWT PROTECTED API
        api:
            pattern: ^/api
            stateless: true
            provider: users_in_database
            user_checker: App\IdentityAccess\Security\UserEnabledChecker
            jwt: ~

    access_control:
        # API
        - { path: ^/api/login(?:_patient)?_check$, roles: PUBLIC_ACCESS }
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/validate$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/appreciations/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/appreciations/anonymous, roles: PUBLIC_ACCESS }
        - { path: ^/api/settings/general/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/sms/webhooks/, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [OPTIONS] }
        - { path: ^/api/portal-patient/me(?:/|$), roles: ROLE_PATIENT }
        - { path: ^/api/(vitrine|administration/appreciations)(?:/|$), roles: [ROLE_ADMIN, ROLE_RECEPTION, ROLE_RECEPTIONNISTE] }
        - { path: ^/api/me, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/me/notifications, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api, roles: [ROLE_ADMIN, ROLE_MEDECIN, ROLE_RECEPTION, ROLE_RECEPTIONNISTE] }
