# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters: 
    upload_files_directory: '%kernel.project_dir%/public/upload_files'
    # Defaults if env vars are absent
    env(MERCURE_PUBLISH_TIMEOUT): '0.8'
    env(MERCURE_PUBLISH_MAX_DURATION): '1.2'
    env(MERCURE_CIRCUIT_COOLDOWN_SECONDS): '60'


services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/DataFixtures/'
            - '../src/Entity/'
            - '../src/Patient/Entity/'
            - '../src/ClinicalRecord/Entity/'
            - '../src/CareDelivery/Entity/'
            - '../src/IdentityAccess/Entity/'
            - '../src/Scheduling/Entity/'
            - '../src/Billing/Entity/'
            - '../src/Communication/Entity/'
            - '../src/Inventory/Entity/'
            - '../src/Settings/Entity/'
            - '../src/Kernel.php'
    App\Communication\Mercure\NotificationTopicGenerator:
        arguments:
            $publicHubUrl: '%env(MERCURE_PUBLIC_URL)%'
            $topicNamespace: '%env(MERCURE_TOPIC_NAMESPACE)%'
    App\Communication\Mercure\MercureCircuitBreaker:
        arguments:
            $cache: '@cache.app'
            $cooldownSeconds: '%env(int:MERCURE_CIRCUIT_COOLDOWN_SECONDS)%'
    # Timeout court sur le hub Mercure (évite les freezes TCP longs).
    # Branché sur mercure.hub.default via MercureHubHttpClientPass.
    mercure.http_client:
        class: Symfony\Component\HttpClient\CurlHttpClient
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        arguments:
            -
                timeout: '%env(float:MERCURE_PUBLISH_TIMEOUT)%'
                max_duration: '%env(float:MERCURE_PUBLISH_MAX_DURATION)%'
    # Hub résilient : circuit breaker autour du hub Mercure (F+B).
    # Priorité > TraceableHub (debug) pour court-circuiter avant l'appel HTTP.
    App\Communication\Mercure\ResilientMercureHub:
        decorates: mercure.hub.default
        decoration_priority: 16
        arguments:
            $inner: '@.inner'
    App\Communication\Service\MercureAuthorizationService:
        arguments:
            $mercurePublicUrl: '%env(MERCURE_PUBLIC_URL)%'
            $tokenFactory: '@mercure.hub.default.jwt.factory'
    App\Communication\Service\MercureHealthService:
        arguments:
            $mercureUrl: '%env(MERCURE_URL)%'
            $mercurePublicUrl: '%env(MERCURE_PUBLIC_URL)%'
            $mercureJwtSecret: '%env(MERCURE_JWT_SECRET)%'
    App\Communication\Command\TestMercurePublishCommand:
        arguments:
            $mercureUrl: '%env(MERCURE_URL)%'
            $mercurePublicUrl: '%env(MERCURE_PUBLIC_URL)%'
            $topicNamespace: '%env(MERCURE_TOPIC_NAMESPACE)%'
    Symfony\Component\Mercure\Jwt\TokenFactoryInterface: '@defaultTokenFactory'
    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@dev:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\DataFixtures\:
            resource: '../src/DataFixtures/'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\DataFixtures\:
            resource: '../src/DataFixtures/'
