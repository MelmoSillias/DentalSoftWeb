nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['^https?://localhost(:[0-9]+)?$', '^https?://127[.]0[.]0[.]1(:[0-9]+)?$', '^https?://10[.]74[.]72[.]84(:[0-9]+)?$']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['*']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/api':
            allow_origin: ['^https?://localhost(:[0-9]+)?$', '^https?://127[.]0[.]0[.]1(:[0-9]+)?$', '^https?://10[.]74[.]72[.]84(:[0-9]+)?$']
            allow_headers: ['*']
            allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        '^/api/login_check':
            allow_origin: ['^https?://localhost(:[0-9]+)?$', '^https?://127[.]0[.]0[.]1(:[0-9]+)?$', '^https?://10[.]74[.]72[.]84(:[0-9]+)?$']
            allow_headers: ['*']
            allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        
