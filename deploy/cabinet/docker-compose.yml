# DentalSoft — un déploiement par cabinet (app all-in-one + MariaDB)
# Dokploy: type Docker Compose, chemin: deploy/cabinet/docker-compose.yml
# Build context relatif à ce fichier → racine monorepo ../../

name: dentalsoft-cabinet

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dentalsoft}
      MYSQL_USER: ${MYSQL_USER:-dentalsoft}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal

  app:
    build:
      context: ../..
      dockerfile: deploy/cabinet/Dockerfile
      args:
        CABINET: ${CABINET:-cdos}
        BUILD_ENV: ${BUILD_ENV:-prod}
        JWT_PASSPHRASE: ${JWT_PASSPHRASE:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PUBLISH_PORT:-80}:80"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
      DATABASE_URL: mysql://${MYSQL_USER:-dentalsoft}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-dentalsoft}?charset=utf8mb4
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://.*$}
      JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
      JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?set JWT_PASSPHRASE}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?queue_name=default}
      MERCURE_URL: ${MERCURE_URL:-}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-}
      MERCURE_TOPIC_NAMESPACE: ${MERCURE_TOPIC_NAMESPACE:-dentalsoft}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      ENABLE_EMBEDDED_WORKER: ${ENABLE_EMBEDDED_WORKER:-1}
      SMS_POLL_INTERVAL: ${SMS_POLL_INTERVAL:-60}
      SMS_DISPATCH_LIMIT: ${SMS_DISPATCH_LIMIT:-20}
      MESSENGER_TIME_LIMIT: ${MESSENGER_TIME_LIMIT:-3600}
      MESSENGER_MEMORY_LIMIT: ${MESSENGER_MEMORY_LIMIT:-128M}
    volumes:
      - uploads:/app/public/uploads
      - backups:/app/var/backups
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - internal

volumes:
  db_data:
  uploads:
  backups:

networks:
  internal:
    driver: bridge
