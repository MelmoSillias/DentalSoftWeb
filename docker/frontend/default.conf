map $http_x_forwarded_proto $dentalsoft_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 256m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # Résolution dynamique : un remplacement de l'API ne laisse pas une ancienne IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://${API_UPSTREAM};
    set $hub http://${MERCURE_UPSTREAM};

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # Pas d'access log : certains anciens clients passent le JWT SSE dans l'URL.
    location = /.well-known/mercure {
        access_log off;
        include /etc/nginx/dentalsoft-proxy.conf;
        proxy_pass $hub$request_uri;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        add_header X-Accel-Buffering no always;
    }

    location ~ ^/(api(?:/|$)|uploads(?:/|$)|upload_files(?:/|$)|assurances(?:/|$)|health(?:/|$)) {
        include /etc/nginx/dentalsoft-proxy.conf;
        proxy_pass $api$request_uri;
        # Les données médicales ne doivent pas être mises en cache par le proxy.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~ ^/(sw\.js|workbox-[^/]+\.js|notification-handler\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
