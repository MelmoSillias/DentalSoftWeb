server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # L'entrée SPA doit toujours être revalidée pour charger les nouveaux bundles hashés.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /release.json {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
        etag off;
        if_modified_since off;
    }

    # Service worker / Workbox / scripts SW : jamais de cache long (sinon MAJ PWA bloquée).
    location ~* ^/(sw\.js|workbox-[^/]+\.js|notification-handler\.js|pwa-release-worker\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Assets versionnés par hash Vite : cache long et sûr.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Manifest PWA : cache court pour permettre les mises à jour.
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
