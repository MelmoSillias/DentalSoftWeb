server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # L'entrée SPA doit toujours être revalidée pour charger les nouveaux bundles hashés.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Assets versionnés par hash Vite : cache long et sûr.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Manifest PWA : cache court pour permettre les mises à jour.
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
