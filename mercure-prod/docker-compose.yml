# Référence alignée sur l'exemple officiel dunglas/mercure, adaptée DentalSoft.
# Usage local : docker compose -f mercure-prod/docker-compose.yml up -d

services:
  mercure:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_PUBLISHER_JWT_KEY:-!ChangeMe!}"
      MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_SUBSCRIBER_JWT_KEY:-!ChangeMe!}"
      MERCURE_CORS_ORIGINS: "${MERCURE_CORS_ORIGINS:-https://admin.cabinetdentaireousmanesow.cloud https://admin.mondentiste-mali.com}"
      TRUSTED_PROXIES: "private_ranges"
    ports:
      - "3000:80"
    volumes:
      - mercure_data:/data
      - mercure_config:/config

volumes:
  mercure_data:
  mercure_config:
