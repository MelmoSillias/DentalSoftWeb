# Usage local : fournir les deux secrets JWT, puis
# docker compose -f mercure-prod/docker-compose.yml up -d --build

services:
  mercure:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_PUBLISHER_JWT_KEY:?Renseigner MERCURE_PUBLISHER_JWT_KEY}"
      MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_SUBSCRIBER_JWT_KEY:?Renseigner MERCURE_SUBSCRIBER_JWT_KEY}"
      MERCURE_CORS_ORIGINS: "${MERCURE_CORS_ORIGINS:-}"
      MERCURE_EXTRA_DIRECTIVES: "${MERCURE_EXTRA_DIRECTIVES:-}"
      MERCURE_HISTORY_SIZE: "${MERCURE_HISTORY_SIZE:-10000}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-private_ranges}"
    ports:
      - "127.0.0.1:${MERCURE_PORT:-3000}:80"
    volumes:
      - mercure_data:/data
      - mercure_config:/config

volumes:
  mercure_data:
  mercure_config:
